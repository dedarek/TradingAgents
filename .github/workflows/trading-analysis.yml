name: TradingAgents Analysis

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker symbol'
        required: true
        default: 'SPY'
        type: string
      date:
        description: 'Analysis date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
  schedule:
    # 每周一至周五 UTC 14:00（美东上午 9:00 盘前）
    - cron: '0 14 * * 1-5'

env:
  PYTHON_VERSION: '3.12'
  # 结果持久化到此目录，随仓库一起保留
  RESULTS_DIR: results

permissions:
  contents: write   # 允许 workflow 推送提交

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整历史，避免后续推送冲突
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: pip install .

      - name: Set date
        id: vars
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "date=${{ inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "ticker=${{ inputs.ticker || 'SPY' }}" >> $GITHUB_OUTPUT

      - name: Run TradingAgents
        run: |
          python scripts/ci_analysis.py \
            --ticker "${{ steps.vars.outputs.ticker }}" \
            --date "${{ steps.vars.outputs.date }}" \
            --output-dir "./${{ env.RESULTS_DIR }}/${{ steps.vars.outputs.date }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRADINGAGENTS_LLM_PROVIDER: ${{ vars.TRADINGAGENTS_LLM_PROVIDER || 'deepseek' }}
          TRADINGAGENTS_DEEP_THINK_LLM: ${{ vars.TRADINGAGENTS_DEEP_THINK_LLM || 'deepseek-v4-pro' }}
          TRADINGAGENTS_QUICK_THINK_LLM: ${{ vars.TRADINGAGENTS_QUICK_THINK_LLM || 'deepseek-v4-flash' }}
          TRADINGAGENTS_OUTPUT_LANGUAGE: ${{ vars.TRADINGAGENTS_OUTPUT_LANGUAGE || 'English' }}
          TRADINGAGENTS_MAX_DEBATE_ROUNDS: ${{ vars.TRADINGAGENTS_MAX_DEBATE_ROUNDS || '1' }}

      - name: Generate dashboard
        if: always()
        run: python scripts/generate_dashboard.py --history ./${{ env.RESULTS_DIR }}/history.jsonl --output-dir ./docs

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.RESULTS_DIR }}/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 ${{ steps.vars.outputs.ticker }} analysis — ${{ steps.vars.outputs.date }} [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
